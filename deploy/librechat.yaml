# LibreChat custom-endpoint config (deploy/README.md §Files; ruling 2026-08-26 "both modes").
#
# The chat page offers TWO kinds of endpoint, switchable per conversation with LibreChat's own
# endpoint picker (top-left of a new chat) — that IS the persona/basic switch the operator asked for:
#
#   1. "Pantheon" — the IDENTITY route. Points at the Facade (M2 skeleton steps 3–8: grounding,
#      taint, write gate, cost meter, session binding). NOT BUILT YET: nothing listens on 8089, so
#      this endpoint answers an error until the Facade lands. Kept so the switch exists from day one.
#   2. "Basic LLM — …" — the RAW BRAIN route, one endpoint per brain. No persona, no memory, no
#      tools, no Peta, no write gate — LibreChat talks straight to the llama.cpp server on the LAN.
#      That is the point: a plain model conversation when no identity is wanted (Bible §9 C.1 bare
#      session, ruling 2026-08-26). Nothing on this path can call a tool, so there is nothing to gate.
#
# Secrets: the 27B brain enforces an API key; it comes from deploy/.env (gitignored) as
# LLM_MINI_API_KEY — never here. The Alden-1 brain server takes no key today.
#
# VERIFY at the M2 LibreChat spike (step-08): the exact header-interpolation and per-conversation
# identity wiring for the Pantheon endpoint is that spike's open question.

version: 1.2.1 # VERIFY: librechat.yaml schema version for the pinned LibreChat build

endpoints:
  custom:
    # ---- 1. Identity route (Facade) — live when M2 lands ----
    - name: "Pantheon"
      # The Facade runs on the VM host (systemd), not in compose:
      baseURL: "http://host.docker.internal:8089/v1"
      apiKey: "pantheon-not-used" # Facade auth is the identity header + network position, not this key
      models:
        default: ["alden-1"] # display name; the Facade resolves identity -> bound backend
        fetch: false
      titleConvo: true
      titleModel: "alden-1"
      modelDisplayLabel: "Pantheon identity (Facade — not built until M2)"
      directEndpoint: true
      headers:
        # Identity/session wiring — THE SPIKE QUESTION (step-08): which LibreChat
        # placeholder reliably identifies the conversation. Candidates per
        # architecture.md:223 and landscape:81:
        x-pantheon-identity: "alden-1" # static single-identity for the skeleton smoke test
        # x-pantheon-session: "{{LIBRECHAT_USER_ID}}" # VERIFY available placeholders in the spike

    # ---- 2. Basic LLM — raw brains, no persona ----
    # Per-conversation THINKING choice (ruling 2026-08-26): the brains honour exactly one per-request
    # control, `chat_template_kwargs.enable_thinking` (on/off — effort levels and budgets are ignored
    # by these llama.cpp builds), and LibreChat cannot put that nested key in its Parameters panel.
    # So each brain gets TWO picker entries: "fast" (thinking off — a factual answer starts in ~0.3 s)
    # and "thinking" (the model's hidden reasoning, streamed visibly as a "Thinking" block). The real
    # target — a Reasoning-effort dropdown on every endpoint, translated per brain — is an M2 Facade
    # requirement (docs/skeleton-steps/step-05-streaming-passthrough.md).
    #
    # Title generation: LibreChat names a conversation with a hidden second request; on a thinking
    # entry that request would itself think for ~20 s and slow the next turn, so titles stay on for
    # the fast entries only.

    - name: "Basic LLM - Alden-1 brain (fast)"
      baseURL: "http://192.168.1.89:8080/v1"
      apiKey: "not-needed"
      models:
        default: ["Qwen3.5-122B-A10B-UD-Q4_K_XL-00001-of-00003.gguf"]
        fetch: true
      addParams:
        chat_template_kwargs:
          enable_thinking: false
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "Basic LLM - Alden-1 brain (Qwen3.5 122B, fast: no thinking, no persona)"

    - name: "Basic LLM - Alden-1 brain (thinking)"
      baseURL: "http://192.168.1.89:8080/v1"
      apiKey: "not-needed"
      models:
        default: ["Qwen3.5-122B-A10B-UD-Q4_K_XL-00001-of-00003.gguf"]
        fetch: true
      customParams:
        reasoningKey: reasoning_content
      titleConvo: false
      modelDisplayLabel: "Basic LLM - Alden-1 brain (Qwen3.5 122B, thinking shown, no persona)"

    - name: "Basic LLM - 27B llm-mini (fast)"
      baseURL: "http://192.168.1.206:8080/v1"
      apiKey: "${LLM_MINI_API_KEY}"
      models:
        default: ["/home/karl/models/heretic-v2-Q5_K_M.gguf"]
        fetch: true
      addParams:
        chat_template_kwargs:
          enable_thinking: false
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "Basic LLM - 27B heretic (llm-mini, fast: no thinking, no persona)"

    - name: "Basic LLM - 27B llm-mini (thinking)"
      baseURL: "http://192.168.1.206:8080/v1"
      apiKey: "${LLM_MINI_API_KEY}"
      models:
        default: ["/home/karl/models/heretic-v2-Q5_K_M.gguf"]
        fetch: true
      customParams:
        reasoningKey: reasoning_content
      titleConvo: false
      modelDisplayLabel: "Basic LLM - 27B heretic (llm-mini, thinking shown, no persona)"
