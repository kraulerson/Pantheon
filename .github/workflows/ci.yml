# solo-orchestrator: platforms=web,desktop,mobile,mcp-server
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # This job builds, tests and audits services/control-plane; the obsidian-mcp job below covers
    # services/obsidian-mcp. peta-eval/harness and prototypes/cli-channel-loop have their own lockfiles
    # and are not covered. Semgrep, gitleaks and the governance steps run at the repository root.
    defaults:
      run:
        working-directory: services/control-plane

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: services/control-plane/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Security - SAST (Semgrep)
        # Semgrep's own image, pinned by digest; --error fails the step on any finding or rule error.
        working-directory: .
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src
          semgrep/semgrep:1.181.0@sha256:81474464c1f07483ba0682a44787fd93c91397419762a04abe2bafaae396304b
          semgrep scan --config p/owasp-top-ten --config p/security-audit --error --metrics=off

      - name: Security - Secret detection (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2 (v2.3.9)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"

      - name: Security - Dependency audit
        run: npm audit --audit-level=high

      - name: Security - License check
        run: npx license-checker --failOn "GPL-2.0;GPL-3.0;AGPL-3.0;LGPL-2.0;LGPL-2.1;LGPL-3.0;SSPL-1.0;EUPL-1.1;EUPL-1.2"
        # MPL-2.0 has file-level copyleft — review on a case-by-case basis if detected

      - name: Security - Lockfile integrity
        run: npm audit signatures

      - name: Governance - Approval log integrity
        if: hashFiles('APPROVAL_LOG.md') != ''
        working-directory: .
        run: |
          if git diff origin/main...HEAD -- APPROVAL_LOG.md 2>/dev/null | grep -qE '^\-[^-]'; then
            echo "::error::APPROVAL_LOG.md has deleted or modified lines. This file is append-only."
            exit 1
          fi

      - name: Governance - Approval author verification
        if: hashFiles('APPROVAL_LOG.md') != ''
        working-directory: .
        run: |
          if git diff --name-only origin/main...HEAD 2>/dev/null | grep -q 'APPROVAL_LOG.md'; then
            COMMIT_AUTHOR=$(git log --format='%an' origin/main...HEAD -- APPROVAL_LOG.md 2>/dev/null | head -1)
            ADDED_LINES=$(git diff origin/main...HEAD -- APPROVAL_LOG.md 2>/dev/null | grep '^+' | grep -i 'Approver' | head -1 || true)
            if [ -n "$ADDED_LINES" ] && [ -n "$COMMIT_AUTHOR" ]; then
              APPROVER_NAME=$(echo "$ADDED_LINES" | awk -F'|' '{ gsub(/^[[:space:]]+|[[:space:]]+$/, "", $3); gsub(/\*/, "", $3); gsub(/\+/, "", $3); print $3 }' | xargs)
              if [ -n "$APPROVER_NAME" ] && [ "$APPROVER_NAME" != "$COMMIT_AUTHOR" ]; then
                echo "::warning::Commit author ($COMMIT_AUTHOR) differs from listed approver ($APPROVER_NAME). Verify this is intentional."
              fi
            fi
          fi

      - name: Governance - Phase gate check
        if: hashFiles('.claude/phase-state.json') != ''
        working-directory: .
        run: |
          if [ ! -f scripts/check-phase-gate.sh ]; then
            echo "::error::Phase gate check script missing. Framework integrity compromised."
            exit 1
          fi
          bash scripts/check-phase-gate.sh

      - name: Governance - Changelog check
        working-directory: .
        run: bash scripts/check-changelog.sh 2>/dev/null || true
        # Tier 1.5: warning only. Set SOIF_STRICT_CHANGELOG=true to block.
        # env:
        #   SOIF_STRICT_CHANGELOG: "true"

      - name: Governance - Session state check
        working-directory: .
        run: bash scripts/check-session-state.sh 2>/dev/null || true
        # Tier 1.5: warning only. Set SOIF_STRICT_SESSION=true to block.
        # env:
        #   SOIF_STRICT_SESSION: "true"

  obsidian-mcp:
    runs-on: ubuntu-latest
    # Builds, tests and audits services/obsidian-mcp. Semgrep, gitleaks and governance run once, in the test job.
    defaults:
      run:
        working-directory: services/obsidian-mcp

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: services/obsidian-mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Security - Dependency audit
        run: npm audit --audit-level=high

      - name: Security - Lockfile integrity
        run: npm audit signatures
